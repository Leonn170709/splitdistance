plugins {
    id 'fabric-loom' version '1.17.17'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // ponytail: Mojang mappings, not yarn. The classes we touch (Options, RenderSystem)
    // are named the same as everything else in this file, and there's no yarn build to track.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Compile-only: we implement ModMenuApi, but the mod runs fine without Mod Menu installed.
    // transitive = false keeps Mod Menu's own Fabric API requirement out of our build.
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

    // Dev client only -- so `runClient` actually has Mod Menu to show the config screen in.
    // localRuntime never ends up in the published jar. Fabric API is here because Mod Menu
    // needs it, not because this mod does.
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
